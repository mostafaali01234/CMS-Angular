<app-header [(collapsed)]="collapsed" [(mobileNavOpen)]="mobileNav" />


@if (auth.isLoggedIn()) {
  <div class="layout">
    <app-sidebar [(collapsed)]="collapsed" [(mobileOpen)]="mobileNav" />
    <main class="content">
      <router-outlet />
    </main>
  </div>
} @else {
  <router-outlet />
}

<app-confirm-dialog />
<app-toast-container />
