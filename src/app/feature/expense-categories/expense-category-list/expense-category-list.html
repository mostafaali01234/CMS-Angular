<!-- expense-category-list/expense-category-list.html -->
<div class="ui-page narrow">
  <div class="ui-page-header">
    <h2 class="ui-title">تصنيفات المصروفات</h2>
    <a routerLink="/expense-categories/new" class="ui-btn ui-btn-primary">+ تصنيف جديد</a>
  </div>

  <input
    type="search"
    class="ui-input"
    style="margin-bottom: 16px"
    placeholder="ابحث بالاسم ..."
    [ngModel]="search()"
    (ngModelChange)="search.set($event)" />

  @if (actionError()) {
    <div class="ui-alert" role="alert" style="margin-bottom: 16px">
      <span>{{ actionError() }}</span>
      <button type="button" class="ui-alert-close" (click)="actionError.set(null)" aria-label="إغلاق">×</button>
    </div>
  }

  @if (loading()) {
    <p class="ui-muted">جاري التحميل...</p>
  } @else if (error()) {
    <div class="ui-alert">
      <span>{{ error() }}</span>
      <button class="ui-btn ui-btn-danger sm" (click)="load()">اعادة المحاولة</button>
    </div>
  } @else {
    <div class="ui-card">
      <div class="ui-table-wrap">
        <table class="ui-table">
          <thead>
            <tr>
              <th>اسم التصنيف</th>
              <th class="end">الإجراءات</th>
            </tr>
          </thead>
          <tbody>
            @for (c of filtered(); track c.id) {
              <tr>
                <td class="strong">{{ c.name }}</td>
                <td class="end nowrap">
                  <a [routerLink]="['/expense-categories', c.id, 'edit']" class="ui-btn ui-btn-outline sm">تعديل</a>
                  <button class="ui-btn ui-btn-danger sm"
                          [disabled]="deletingId() === c.id"
                          (click)="remove(c)">
                    {{ deletingId() === c.id ? 'جاري الحذف...' : 'حذف' }}
                  </button>
                </td>
              </tr>
            } @empty {
              <tr>
                <td colspan="3" class="center ui-muted" style="padding: 28px">لا توجد تصنيفات.</td>
              </tr>
            }
          </tbody>
        </table>
      </div>
    </div>
  }
</div>
