<!-- store-form/store-form.html -->
<div class="ui-page narrow">
  <div class="ui-page-header">
    <h2 class="ui-title">{{ id() ? 'تعديل مخزن' : 'اضافة مخزن جديد' }}</h2>
  </div>

  @if (loading()) {
    <p class="ui-muted">جاري التحميل...</p>
  } @else {
    <form [formGroup]="form" (ngSubmit)="save()" class="ui-card">
      <div class="ui-card-body">
        <div class="ui-grid">

          <div class="ui-field full">
            <label class="ui-label" for="name">اسم المخزن</label>
            <input id="name" class="ui-input" formControlName="name" [class.is-invalid]="invalid('name')" />
            @if (invalid('name')) { <span class="ui-error-text">الرجاء ادخال اسم المخزن (حتى 150 حرفا)</span> }
          </div>

          <app-lookup-select
            formControlName="manager_id"
            [loader]="lookup.employees"
            [filter]="activeOnly"
            label="المدير"
            placeholder="اختر المدير"
            error="اختر المدير"
            [invalid]="invalid('manager_id')" />

          <div class="ui-field">
            <label class="ui-label" for="phone">الهاتف</label>
            <input id="phone" class="ui-input" formControlName="phone" [class.is-invalid]="invalid('phone')" />
            @if (invalid('phone')) { <span class="ui-error-text">رقم هاتف غير صحيح</span> }
          </div>

          <app-lookup-select
            formControlName="city_id"
            [loader]="lookup.cities"
            label="المدينة"
            placeholder="اختر المدينة"
            error="اختر المدينة"
            [invalid]="invalid('city_id')" />

          <div class="ui-field">
            <label class="ui-label" for="address">العنوان</label>
            <input id="address" class="ui-input" formControlName="address" [class.is-invalid]="invalid('address')" />
            @if (invalid('address')) { <span class="ui-error-text">الرجاء ادخال العنوان</span> }
          </div>

          <div class="ui-field full">
            <label class="ui-label" for="notes">ملاحظات</label>
            <textarea id="notes" rows="3" class="ui-input" formControlName="notes"></textarea>
          </div>

          <div class="ui-field full">
            <label><input type="checkbox" formControlName="active" /> نشط</label>
          </div>

        </div>

        @if (error()) {
          <div class="ui-alert" role="alert" style="margin-top: 16px">{{ error() }}</div>
        }
      </div>

      <div class="ui-card-footer">
        <a routerLink="/stores" class="ui-btn ui-btn-outline">الغاء</a>
        <button type="submit" class="ui-btn ui-btn-primary" [disabled]="saving()">
          {{ saving() ? 'جاري الحفظ...' : (id() ? 'حفظ' : 'اضافة') }}
        </button>
      </div>
    </form>
  }
</div>
