<!-- project-list/project-list.html -->
<div class="ui-page">
  <div class="ui-page-header">
    <h2 class="ui-title">المشاريع</h2>
    <div>
      <a routerLink="/projects/review" class="ui-btn ui-btn-outline">مراجعة المشاريع</a>
      <a routerLink="/projects/new" class="ui-btn ui-btn-primary">+ مشروع جديد</a>
    </div>
  </div>

  <input type="search" class="ui-input" style="max-width: 320px; margin-bottom: 16px" placeholder="بحث بالاسم..."
         [ngModel]="search()" (ngModelChange)="search.set($event)" />

  @if (error()) {
    <div class="ui-alert"><span>{{ error() }}</span>
      <button class="ui-btn ui-btn-danger sm" (click)="load()">اعادة المحاولة</button></div>
  }

  <div class="ui-card" [style.opacity]="loading() ? 0.55 : 1">
    <div class="ui-table-wrap">
      <table class="ui-table">
        <thead><tr><th>#</th><th>الاسم</th><th>ملاحظات</th><th class="end">الإجراءات</th></tr></thead>
        <tbody>
          @for (p of items(); track p.id) {
            <tr>
              <td>{{ p.id }}</td>
              <td class="strong">{{ p.name }}</td>
              <td class="ui-muted">{{ p.notes }}</td>
              <td class="end nowrap">
                <a [routerLink]="['/projects/review', p.id]" class="ui-btn ui-btn-outline sm">مراجعة</a>
                <a [routerLink]="['/projects', p.id, 'edit']" class="ui-btn ui-btn-outline sm">تعديل</a>
                <button class="ui-btn ui-btn-danger sm" [disabled]="deletingId() === p.id" (click)="remove(p)">
                  {{ deletingId() === p.id ? 'جاري الحذف...' : 'حذف' }}
                </button>
              </td>
            </tr>
          } @empty {
            <tr><td colspan="4" class="center ui-muted" style="padding: 28px">
              {{ loading() ? 'جاري التحميل...' : 'لا توجد مشاريع.' }}
            </td></tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
