<!-- shared/components/lookup-select/lookup-select.html -->
<div class="ui-field">
  @if (label()) {
    <label class="ui-label" [for]="'lookup-' + uid">{{ label() }}</label>
  }
  <select [id]="'lookup-' + uid" class="ui-input"
          [ngModel]="value()" (ngModelChange)="select($event)"
          [ngModelOptions]="{ standalone: true }"
          [disabled]="disabled()" (blur)="touched()"
          [class.is-invalid]="invalid() || loadFailed()">
    @if (showPlaceholder()) {
      <option [ngValue]="0">{{ placeholder() }}</option>
    }
    <!-- <option [ngValue]="0">{{ placeholder() }}</option> -->
    @for (o of options(); track o.id) {
      <option [ngValue]="o.id">{{ display()(o) }}</option>
    }
  </select>
  @if (loadFailed()) {
    <span class="ui-error-text">تعذر تحميل القائمة</span>
  } @else if (invalid()) {
    <span class="ui-error-text">{{ error() }}</span>
  }
</div>
