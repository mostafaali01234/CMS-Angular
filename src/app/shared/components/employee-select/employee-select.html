<!-- shared/components/employee-select/employee-select.html -->
<div class="ui-field">
  <label class="ui-label" [for]="'emp-' + uid">{{ label() }}</label>
  <select [id]="'emp-' + uid" class="ui-input"
          [ngModel]="value()" (ngModelChange)="select($event)"
          [ngModelOptions]="{ standalone: true }"
          [disabled]="disabled()" (blur)="touched()"
          [class.is-invalid]="invalid() || loadFailed()">
    <option [ngValue]="0">{{ placeholder() }}</option>
    @for (e of options(); track e.id) {
      <option [ngValue]="e.id">{{ e.name }}</option>
    }
  </select>
  @if (loadFailed()) {
    <span class="ui-error-text">تعذر تحميل قائمة الموظفين</span>
  } @else if (invalid()) {
    <span class="ui-error-text">{{ error() }}</span>
  }
</div>
